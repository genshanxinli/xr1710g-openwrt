      - target/linux/airoha/an7581/base-files/etc/hotplug.d/net/50-bridge-hw-offload:40
    evidence: 实测
    date: "2026-11-20"
    status: supported
    notes: "2026-11-20 04:38 UTC 在 r38047-a86ce12e27 上一条 SSH 内顺序执行 nft list flowtables / ls brif / fw4 print 得到；设备是共享机，别人 wifi reload 会改变 vif 集合，所以复测要在同一时刻取三份输出。日志侧有同批 reload already in progress, giving up，说明放弃的重载没有补跑。"

  - id: nf-flow-pppoe-trace-compiled
    claim: "airoha/an7581 的默认 7.3 内核现在会编入 nf_flow_pppoe tracepoint：config/Config-kernel.in 给 KERNEL_FTRACE 和 KERNEL_ENABLE_DEFAULT_TRACERS 加了 default y if TARGET_airoha_an7581，生成的 linux-7.3/.config 有 CONFIG_TRACEPOINTS=y，net/netfilter/nf_flow_table_ip.o 里有 __tracepoint_nf_flow_pppoe；同一份源码在改之前的 tracing-off 配置下该符号为 0。"
    source:
      - config/Config-kernel.in:377
      - config/Config-kernel.in:400
      - target/linux/airoha/patches-7.3/917-netfilter-flowtable-add-opt-in-pppoe-ingress-trace.patch:104
      - https://github.com/genshanxinli/xr1710g-openwrt/issues/60
    evidence: 实测
    date: "2026-11-20"
    status: supported
    notes: "实测只到编译产物：干净 defconfig 得到 CONFIG_KERNEL_FTRACE=y 与 CONFIG_KERNEL_ENABLE_DEFAULT_TRACERS=y，内核 .config 有 CONFIG_TRACEPOINTS=y，nm 目标文件有 15 个 nf_flow_pppoe 符号；未验证：现网 r38047 镜像仍是 tracing-off，本机没有 PPPoE 会话（wan proto=dhcp，/proc/net/pppoe 0 条），从未采到真实 PPPoE 入向事件，available_events 要等新镜像启动后才会有该事件。"

  - id: wifi-self-loopback-not-possible
    claim: "XR1710G（mt7996e，单 wiphy phy0）上无法建立单机 AP+STA 环回：同一 phy 的发射不上自己的接收路径，任何 VIF 都关联不到自己承载的 BSS。"
    source:
      - https://github.com/genshanxinli/xr1710g-openwrt/issues/191
    evidence: 实测
    date: "2026-11-20"
    status: supported
    notes: "自收判据取自 6 GHz ch37（ch_time_busy 占比 0.4%，介质几乎无他源）20 s 窗口 rx_mpdu_cnt 恒 0；对照取自同一条 managed VIF 打邻居 AP 成功（sta_state=2、tx_packets=1、rx_packets=14）、打自己 AP 返回 -2（ENOENT）且计数器全零。原始输出未提交进库（/tmp 在重刷后清空），文件内嵌了关键行。该结论针对 mt7996e + r38047，不是对 mt76 全系的断言。"

  - id: wifi-single-radio-one-channel
    claim: "phy0 的 per-radio valid interface combinations 是 #{ AP, mesh point } <= 16, #{ managed } <= 19, total <= 19, #channels <= 1, STA/AP BI must match，因此同一 radio 上的 AP 与 STA 只能共用一个信道，跨 band 环回被这条约束排除。"
    source:
      - https://github.com/genshanxinli/xr1710g-openwrt/issues/191
    evidence: 实测
    date: "2026-11-20"
    status: supported
    notes: "读自 `iw phy phy0 info`（r38047）；三个 radio 的组合条款各自完全相同，全局条款是 #{ IBSS, managed, AP, mesh point } <= 57, total <= 57, #channels <= 3，那是跨 radio 的总量，不放宽单 radio 的 1 信道限制。同一 radio 内的 STA 侧 chanctx 请求在已有 AP chanctx 时返回 EBUSY（iw dev <sta> set freq 5745 80 5775 → Resource busy -16），即便三个 AP 全禁用仍复现。"

  - id: wifi-managed-set-channel-rejected
    claim: "mac80211 上 managed VIF 不允许显式设置信道，iw set freq / set channel 一律返回 Resource busy (-16)；先锁信道再 connect 的规避手段在 mt7996e 上没有可行性。"
    source:
      - package/kernel/mac80211/Makefile:13
    evidence: 实测
    date: "2026-11-20"
    status: supported
    notes: "实测部分：r37994/r38034/r38047 三版固件上都复现 -16，且在三个 AP VIF 全部 disabled、一个 VIF 不剩时仍然 -16。代码部分只指向本仓用的 backports 版本（PKG_SOURCE_VERSION:=7.2），对应的 cfg80211/mac80211 源码不在 repo 内（dl/backports-7.2.tar.zst），所以 -16 的具体来源未在库内留下 file:line。"

