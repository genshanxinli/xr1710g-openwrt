  - id: flowtable-ft-missing-wlan-vifs
    claim: "运行时已加载的 inet fw4 flowtable ft 的设备集合是 {lan2,lan3,lan4,wan}，不含 br-lan 里的 wlan vif；同一时刻 fw4 print 按当前状态会给出含 phy0.0-ap0/phy0.1-ap0 的集合，即已加载的 ft 是重载旧快照，缺口是重载竞争而不是 fw4 过滤。"
    source:
