    date: "2026-11-15"
    status: supported
    notes: "驱动源码在上游内核树，不在本仓库；issue #72 记录的 REV 0x0301a25d、OPTION1 0x000fe007 与无 GCM/ChaCha 一致。不要宣传 GCM/ChaCha 或 ≥5 Gbit/s。 追加(claimsv)：manual: 驱动源码在上游内核树，本仓无路径可复核，verified_at 记那次实测的 sha。"

