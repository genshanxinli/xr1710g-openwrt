  - id: 5g-half-offload
    claim: "5G（band1）默认仍是半卸载：树内 mt76 0016 只提供 opt-in 的 npu_band1_tx 窗口（默认关闭，要设 module param 才建），关着时 band1 没有独立的 NPU TX buffer window，WAN→5G 只能走 host 注入（约 1 核/G）；2.4G/6G 有自有窗口。"
    source:
      - package/kernel/mt76/patches/0016-wifi-mt76-mt7996-give-band1-its-own-NPU-TX-buffer-space.patch:7
      - package/kernel/mt76/patches/0016-wifi-mt76-mt7996-give-band1-its-own-NPU-TX-buffer-space.patch:11
      - https://github.com/genshanxinli/xr1710g-openwrt/issues/98
    evidence: 推断
    date: "2026-11-21"
    status: unverified
    notes: "0016 在树里但默认不建窗口：The NPU TX window setup ... 只给 band0/band2 装了 band、band+5、band+10 三块；band1 要 npu_band1_tx=1 才装同样的三块，失败或固件拒绝就退回 host 注入。约 1 核/G 与 2.4G/6G 有窗口仍是 issue #98 的背景推断，未在本树测；窗口是否被固件接受、开窗后吞吐多少未验，issue #98 仍 open。"

    verify:
      - "text: package/kernel/mt76/patches/0016-wifi-mt76-mt7996-give-band1-its-own-NPU-TX-buffer-space.patch:7 buffer spaces for band0 and band2.  Band1 (5 GHz) has no window"
