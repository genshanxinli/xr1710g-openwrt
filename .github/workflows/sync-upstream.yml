name: sync-upstream

# 决策：2h 自动同步上游 + 补丁层 dry-run 校验（借鉴 fanboy 每 2h rebase 模型；
# 补丁层冲突面越小越好——同步越勤，冲突越少。冲突=CI 红，处理=修补丁层，不降级。）

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - 'scripts/apply-patches.sh'
      - 'scripts/audit-patches.sh'
      - 'scripts/verify-copy-patches.sh'
      - 'scripts/prepare-oc.sh'
      - 'config/**'
      - 'files/**'

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 克隆最新 openwrt master 并叠加本仓库
        run: |
          git clone -q --depth 1 https://github.com/openwrt/openwrt.git openwrt
          rsync -a --exclude='.git' --exclude='audit-ubi2oc' --exclude='.github' --exclude='openwrt' \
            "$GITHUB_WORKSPACE/" openwrt/
          cd openwrt
          chmod +x scripts/*.sh

      - name: 补丁层 dry-run（默认 + OC + 实验档）
        run: |
          cd openwrt
          # F25（2026-08-18）：加 --experimental——实验档补丁同样需要 2h 漂移检测，
          # 否则 #EXP 条目只在手动构建时才暴露上下文漂移（F20/F21/F23 盲区同型）
          ./scripts/apply-patches.sh . --dry-run --oc --experimental
          echo "上游 HEAD: $(git rev-parse --short HEAD)"

      - name: OC 脚本语法与档位自检
        run: |
          cd openwrt
          bash -n scripts/prepare-oc.sh && echo "prepare-oc.sh 语法 OK"
          bash -n scripts/build.sh && echo "build.sh 语法 OK"