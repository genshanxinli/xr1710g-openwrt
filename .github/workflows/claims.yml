# The claim ledger is an index, not the evidence: this job only checks the
# bookkeeping (required fields, allowed statuses, resolvable sources).  It
# does not build, flash or re-measure anything.
name: Claim ledger

on:
  pull_request:
  push:
    branches:
      - xr1710g
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate the claim ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the ledger
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # --strict --max-unverified is the budget, and it is enforced here.  The
      # default mode only validates fields/sources/statuses and prints the
      # unverified count; that count was decorative, so "the unverified pile
      # grew" never turned a PR red.  5 rows are unverified today; the budget
      # is 9 so one work item may sit unverified while its measurement runs.
      # Lower the number when a row gets verified: it is a ratchet, not a
      # licence to add four permanently-unverified rows.
      - name: Check fields, sources and statuses (strict unverified budget)
        run: python3 scripts/check-claims.py --strict --max-unverified 9

      # One extra step: re-check the CONTENT of the rows that carry a verify:
      # assertion.  A cited line must still say what the row claims and a
      # Kconfig key must still hold its value; the self-test guards the verifier
      # itself, and a row's cited path:line must still exist and hold evidence
      # even when the row carries no verify: hook (the skipped rows otherwise
      # never look at their own sources).  --skip device is deliberate: this runner is an ephemeral
      # ubuntu-latest with no XR1710G attached, so a device: assertion could
      # only fail on ssh or pass on a stale host.  Those rows carry
      # manual: true + verified_at and are re-read by hand.  Without a build_dir
      # the symbol: assertions SKIP; SKIP is reported in the summary line and
      # never fails the job, --strict only gates on FAIL.
      - name: Re-check claim content (static layer, no device)
        run: |
          python3 scripts/claims-verify.py --strict --skip device
          python3 -m unittest scripts/tests/test_claims_verify.py \
            scripts/tests/test_claims_sources_exist.py

      # Issue #189: README records the upstream-drift facts in one
      # <!-- upstream-record: ... --> line rather than in prose.  This checkout
      # is shallow (depth 1) and has no upstream/* or origin/kernel73 refs, so
      # only the static half can run here: the line must be well formed and must
      # describe the defaults scripts/track-upstream.sh compares against.  The
      # refs half is `scripts/track-upstream.sh --check` on a full clone - the
      # weekly workflow that would run it has no runner, so this is the only
      # place CI ever touches the record.
      - name: Check the README upstream record (no refs needed)
        run: sh scripts/track-upstream.sh --static

      # The unverified budget above is the enforceable half of this ledger:
      # an unverified-count regression fails the PR that adds the row, which is
      # where it can still be fixed, not a release that reads the ledger later.
