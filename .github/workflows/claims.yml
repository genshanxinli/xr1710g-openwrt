# The claim ledger is an index, not the evidence: this job only checks the
# bookkeeping (required fields, allowed statuses, resolvable sources).  It
# does not build, flash or re-measure anything.
name: Claim ledger

on:
  pull_request:
  push:
    branches:
      - xr1710g
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate the claim ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the ledger
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check fields, sources and statuses
        run: python3 scripts/check-claims.py

      # scripts/check-claims.py --strict --max-unverified N is available for
      # release checks; the PR job only enforces the ledger's own invariants.
