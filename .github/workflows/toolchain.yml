name: Build Toolchains
# push covers protected branches only; PR branches are covered by pull_request.

on:
  pull_request:
    paths:
      - '.github/workflows/toolchain.yml'
      - 'toolchain/**'
  push:
    paths:
      - '.github/workflows/toolchain.yml'
      - 'toolchain/**'
    branches:
      - xr1710g
      - kernel73
      - kernel74

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-toolchains:
    name: Build Toolchains for each target
    permissions:
      contents: read
      packages: read
      actions: write
    uses: openwrt/actions-shared-workflows/.github/workflows/toolchain.yml@main
