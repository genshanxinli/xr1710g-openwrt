name: Check release image features

# 974 (BQL) and 968 (napi_complete_done) have to be in the XR1710G image,
# not merely in target/linux/airoha/patches-7.4.  The self-test job proves the
# gate itself works on every change; the release-branch audit fails when the
# branch that publishes images does not carry the changes (the release build
# must also run the full build+image check, see docs/release-image-features-gate.md).

on:
  pull_request:
    paths:
      - 'scripts/check-release-image-features.py'
      - 'scripts/tests/check-release-image-features.py'
      - 'docs/release-image-features-gate.md'
      - '.github/workflows/check-release-image-features.yml'
  push:
    branches:
      - xr1710g
    paths:
      - 'scripts/check-release-image-features.py'
      - 'scripts/tests/check-release-image-features.py'
      - 'docs/release-image-features-gate.md'
      - 'target/linux/airoha/patches-7.4/**'
      - '.github/workflows/check-release-image-features.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Offline self-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run gate self-tests
        run: python3 scripts/tests/check-release-image-features.py

  release-branch-audit:
    name: Release branch carries 968/974
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source audit
        run: |
          set +e
          python3 scripts/check-release-image-features.py \
            --repo . --skip-build --skip-image > audit.log 2>&1
          rc=$?
          cat audit.log
          {
            echo "### Release branch source audit"
            echo ""
            echo '```'
            cat audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
