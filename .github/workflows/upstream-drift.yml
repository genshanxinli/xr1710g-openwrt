# Issue #189: the fork parent (OpenWRT-fanboy/OpenW1700k) stays visible, but
# the "should we sync yet" decision is not re-argued here.  That decision was
# taken in #189 (keep the deviation; no full rebase - the first replayed commit
# already hits 171 add/add conflicts, the device builds 7.4 while the rebase
# would land on 7.3) and turned into an exit code by PR #329:
#
#   0  ok        nothing to do, nothing to record
#   1  review    record one line in #189, wait for the next quarter
#   2  must-act  schedule the S2 pick window (security -> airoha -> mt76)
#   3  unknown   the refs are broken (fetch failed, branch deleted): fix refs
#
# This workflow only carries that code to a scheduler.  It never pushes,
# merges, rebases, tags or edits a branch; it reads refs and reads the verdict.
#
# Schedule: the decision is reviewed once per quarter.  GitHub cron has neither
# "first Monday of the quarter" nor a quarterly frequency, so the cron says
# "Monday that falls in the first seven days of a month" (that is the first
# Monday) and the first step says "only January/April/July/October".  A run that
# catches February, May, August or November exits 0 on purpose: a skipped month
# is not a failure, and a green run with one line of explanation is easier to
# read than a disabled schedule someone will forget to re-enable.
#
# A must-act verdict fails the job on purpose.  A scheduled run that goes red
# is the only notification GitHub sends to the owner without an SMTP setup;
# printing the verdict in a green run would make the one actionable state
# indistinguishable from the three harmless ones.
#
# This repository has no Actions runner (`actions/runners` total_count = 0),
# so nothing here has executed yet: the first real run is the first Monday of
# the next quarter-start month.  Until then the local equivalents are
# `sh scripts/track-upstream.sh --fetch --verdict` (needs a full clone) and
# `sh scripts/track-upstream.sh --static` in claims.yml (shallow, no refs).

name: Upstream drift verdict

on:
  schedule:
    # A Monday in days 1-7 is the first Monday of that month; the quarter gate
    # in the first step keeps the other eight months quiet.
    - cron: '17 5 1-7 * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = report only; verdict = also fail the job on must-act'
        type: choice
        options:
          - verdict
          - check
        default: verdict

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  verdict:
    name: OpenW1700k drift verdict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run only in the first month of a quarter
        id: quarter
        run: |
          set -eu
          month=$(date -u +%m)
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            case "$month" in
              01|04|07|10)
                echo "quarter: 季度首月 $month，继续"
                ;;
              *)
                echo "不是季度首月，跳过（月份 $month；季度首月只有 1/4/7/10）"
                echo "不是季度首月，跳过（月份 $month）" >> "$GITHUB_STEP_SUMMARY"
                echo "quarter=0" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          echo "quarter=$month" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream and read the verdict
        id: verdict
        if: steps.quarter.outputs.quarter != '0'
        env:
          MODE: ${{ inputs.mode || 'verdict' }}
        run: |
          set -eu
          # track-upstream.sh --fetch fetches this remote; a force-pushed
          # upstream is why no pin is trusted as a baseline anywhere here.
          git remote add upstream https://github.com/OpenWRT-fanboy/OpenW1700k.git 2>/dev/null || true
          set +e
          sh scripts/track-upstream.sh --fetch --quiet --verdict >verdict.txt 2>&1
          code=$?
          set -e
          cat verdict.txt

          sh scripts/track-upstream.sh --list-hot >hot.txt 2>&1 || true
          hot_total=$(wc -l <hot.txt | tr -d ' ')

          {
            echo "## Upstream drift verdict"
            echo ""
            echo '```'
            cat verdict.txt
            echo '```'
            echo ""
            echo "- exit code: \`$code\` (0 ok / 1 review / 2 must-act / 3 unknown)"
            echo "- mode: \`$MODE\`"
            echo "- hot-path commits: $hot_total, first 30 below"
            echo ""
            echo '```'
            head -30 hot.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -eq 0 ]; then
            echo "verdict ok: 无需动作，本季度到此为止"
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "verdict review: 在 issue #189 记一条，等下一个季度首月"
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            if [ "$MODE" = check ]; then
              echo "::warning::verdict must-act (mode=check: 只报告，不失败)"
              exit 0
            fi
            echo "::error::verdict must-act: 排 S2 挑拣窗口（顺序 安全 -> airoha -> mt76）"
            exit 1
          fi
          echo "::error::verdict unknown (exit $code): refs 坏了，当天修 refs"
          exit 1
