name: build

# 构建：手动触发（matrix stock/experimental）或 main push。
# 上游同步不在此处——由 sync-upstream.yml 每 2h 自动校验补丁层（决策：同步越勤冲突越少）。
# CPU 唯一档（F89，2026-09-08）：所有档位均 OPP 650–1350 + oc-auto 自动退档（1350→1300→1200）。
# experimental 档（F25，2026-08-18）：默认档 + MANIFEST #EXP 条目，供实验补丁构建验证；
#   'all' 聚合 release 档位（stock），experimental 单独 dispatch。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '构建档位（stock / experimental / all）'
        default: 'all'
        required: true
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          P='${{ github.event.inputs.profile || 'stock' }}'
          case "$P" in stock|experimental|all) ;; *) echo "错误：未知档位 $P" >&2; exit 1 ;; esac
          if [ "$P" = "all" ]; then echo "matrix={\"profile\":[\"stock\"]}" >> "$GITHUB_OUTPUT"
          else echo "matrix={\"profile\":[\"$P\"]}" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
      fail-fast: false
    env:
      PROFILE: ${{ matrix.profile }}
      TREE: ${{ github.workspace }}/openwrt
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: 克隆最新 openwrt master 并叠加本仓库（叠加层模型）
        run: |
          git clone -q --depth 1 https://github.com/openwrt/openwrt.git "$TREE"
          rsync -a --exclude='.git' --exclude='audit-ubi2oc' --exclude='.github' --exclude='openwrt' \
            "$GITHUB_WORKSPACE/overlay/" "$TREE/"
          cd "$TREE" && chmod +x scripts/*.sh

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            time

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: openwrt-${{ env.PROFILE }}

      - name: 应用补丁层（实验档补丁）+ files overlay
        run: |
          cd "$TREE"
          EXP_FLAG=""
          [[ "$PROFILE" == "experimental" ]] && EXP_FLAG="--experimental"
          ./scripts/apply-patches.sh . $EXP_FLAG
          mkdir -p files && cp -rf "$GITHUB_WORKSPACE/overlay/files/." files/

      - name: CPU OC（唯一档：OPP 650–1350；稳性退档由 files/etc/init.d/oc-auto 运行时兜底，F89）
        run: |
          cd "$TREE"
          ./scripts/prepare-oc.sh oc .

      - name: feeds
        run: |
          cd "$TREE"
          cp -f feeds.conf.default feeds.conf
          cat "$GITHUB_WORKSPACE/overlay/config/feeds.custom.conf" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: feed 包定义补丁（改 feed 包 Makefile 的唯一正确机制）
        # netbird 提版改的是 feed 包 Makefile，不能走 patches/packages/（那条路在解开的**包源码**
        # tarball 上应用；netbird tarball 是上游源码仓库、无 OpenWrt 包 Makefile，且 Go 配方不跑
        # 源码 make ⇒ 必然 Patch failed）。详见 patches/feeds/ 补丁头注释与 verify-copy-patches.sh。
        run: |
          set -euo pipefail
          cd "$TREE"
          "${GITHUB_WORKSPACE}/overlay/scripts/patch-feeds.sh" .
          # 断言落地生效（避免"跑过了但没改到"）
          grep -q '^PKG_VERSION:=0.78.1$' feeds/packages/net/netbird/Makefile
          grep -q 'kmod-ipt-ipset' feeds/packages/net/netbird/Makefile
          echo "✓ netbird 提版已生效：$(grep -E '^PKG_VERSION:=' feeds/packages/net/netbird/Makefile)"

      - name: 配置（defconfig + seed）
        run: |
          cd "$TREE"
          make defconfig
          cat "$GITHUB_WORKSPACE/overlay/config/seed-config.diff" >> .config
          # 实验档增量 seed：MANIFEST #EXP 补丁提供的包不在共享 seed 中（否则 stock 会引用不存在的包）。
          # 必须在第二次 defconfig 前追加，且共享 seed 末尾保持换行（否则两段 seed 会粘成一行）。
          if [[ "$PROFILE" == "experimental" ]]; then
            cat "$GITHUB_WORKSPACE/overlay/config/seed-config.experimental.diff" >> .config
          fi
          make defconfig
          grep -q "CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y" .config || { echo "XR1710G 目标未选中——检查 #22397 补丁与 seed"; exit 1; }
          if [[ "$PROFILE" == "experimental" ]]; then
            grep -q '^CONFIG_PACKAGE_bridge-flow-offload=y$' .config || { echo "实验档 bridge-flow-offload 未选入 .config（issue #1 E1）"; exit 1; }
          fi
          "${GITHUB_WORKSPACE}/overlay/scripts/audit-config.sh" "${GITHUB_WORKSPACE}/overlay/config/seed-config.diff" .config
          if [[ "$PROFILE" == "experimental" ]]; then
            "${GITHUB_WORKSPACE}/overlay/scripts/audit-config.sh" "${GITHUB_WORKSPACE}/overlay/config/seed-config.experimental.diff" .config
          fi

      - name: 代理/组网不变量门禁（I1–I4，plan/00 §3）
        # 把"不写 flow_offloading / 不 reload fw4 / .nft 不碰 inet fw4 / uci-defaults 不 enable"
        # 从文档条款变成构建前的一道红/绿闸门（脚本已负向验证：注入违规必红）。
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/overlay/scripts/gate-proxy-invariants.sh"

      - name: workflow 结构自检（build.yml 是最关键自动化，改错一行会静默失效）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/overlay"
          python3 scripts/check-workflow-yaml.py

      - name: 代理数据面离线冒烟（渲染 + I1–I4 + sing-box schema）
        # 用与设备同版（1.14.0）的 sing-box 官方 amd64 二进制做真实 `check`，
        # 覆盖：nft 模板四态渲染、区间重叠拒绝、硬约束静态断言、配置 schema。
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # CN 快照完整性（离线：只校验已提交的快照，不联网）
          "${GITHUB_WORKSPACE}/overlay/scripts/fetch-cn-list.sh" --check
          # 取与设备同版（feed 里的 sing-box 1.14.0）官方 amd64 二进制，仅用于 schema 校验
          SB_VER=1.14.0
          if curl -fsSL --retry 3 -o sb.tgz \
              "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"; then
            tar xzf sb.tgz && SINGBOX="$(find . -name sing-box -type f -perm -u+x | head -1)"
            echo "sing-box for schema check: $SINGBOX ($($SINGBOX version | head -1))"
            SINGBOX="$GITHUB_WORKSPACE/$SINGBOX" "${GITHUB_WORKSPACE}/overlay/scripts/test-proxy-package.sh"
          else
            # 网络不可用不应假红（与 verify-copy-patches 对下载失败的策略一致）；
            # 但**必须**至少跑不含 schema 的静态部分，避免整步静默跳过。
            echo "⚠ 无法下载 sing-box（网络）——跳过 schema 校验，仅跑静态部分"
            "${GITHUB_WORKSPACE}/overlay/scripts/test-proxy-package.sh"
          fi

      - name: 构建
        # F19：显式 pipefail——make 失败必须红（默认 bash 无 pipefail，`make | tee` 会把失败吞成假绿；
        #   曾导致 2026-08-17 三次构建（openssl 下载失败）全部假绿、firmware artifact 从未产出）
        run: |
          set -euo pipefail
          cd "$TREE"
          # E2：DISTRIB_DESCRIPTION 注入档位标识（CONFIG_VERSION_DIST 经 include/version.mk 进入 /etc/openwrt_release）
          make -j"$(nproc)" V=s CONFIG_VERSION_DIST="OpenWrt $PROFILE" 2>&1 | tee "$GITHUB_WORKSPACE/build-$PROFILE.log"

      - name: 产出 kmod 包与包索引（自建 feed 的前提）
        # ⚠️ **为什么必须单独跑**（dsh-2026-09-11 的教训，ci-118 实测）：
        #   默认 `make` 只把 `=y` 的 kmod 编进镜像，**不产出**
        #   `bin/targets/<t>/<s>/kmods/` 目录，也**不产** `packages.adb` 索引。
        #   ci-118 的 kmodsfeed 附件因此是空的（0 个 kmod-*.apk、0 个 .adb）——
        #   而上传步骤当时是 `if-no-files-found: warn`，**静默通过**。
        #   ⇒ 这里显式产出 + 下面的上传步骤改为 `error` + 断言索引存在。
        run: |
          set -euo pipefail
          cd "$TREE"
          echo "== 编译 target/linux（产出 kmods/ 与未选入镜像的 kmod 包）=="
          make -j"$(nproc)" V=s target/linux/compile 2>&1 | tee -a "$GITHUB_WORKSPACE/build-$PROFILE.log"
          echo "== 生成包索引（packages.adb / APKINDEX）=="
          make -j"$(nproc)" V=s package/index 2>&1 | tee -a "$GITHUB_WORKSPACE/build-$PROFILE.log"
          echo "== 产出核对 =="
          KMODS_DIR="$(ls -d bin/targets/airoha/an7581/kmods/*/ 2>/dev/null | head -1)"
          echo "kmods 目录：${KMODS_DIR:-（未产出）}"
          if [[ -z "$KMODS_DIR" ]]; then
            echo "✗ 未产出 bin/targets/airoha/an7581/kmods/ —— 自建 kmods feed 无法成立" >&2
            exit 1
          fi
          echo "  kmod 包数：$(find "$KMODS_DIR" -name '*.apk' | wc -l)"
          echo "  索引：$(ls "$KMODS_DIR" | grep -cE 'packages\.adb|APKINDEX' || true)"
          for m in wireguard ipt-ipset tun nft-tproxy; do
            if find "$KMODS_DIR" -name "kmod-$m-*.apk" | grep -q .; then
              echo "  ✓ kmod-$m 在 feed 内"
            else
              echo "  ⚠ kmod-$m 不在 feed 内（可能已 =y 编进镜像，或需加 CONFIG_PACKAGE_kmod-$m=m）"
            fi
          done
          echo "== 索引文件 =="
          find bin -name 'packages.adb' -o -name 'APKINDEX*' | head -10

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ env.PROFILE }}
          path: build-${{ env.PROFILE }}.log

      - name: 固件体积自检（plan/00 §4.5）+ 产出基线
        if: success()
        run: |
          set -euo pipefail
          cd "$TREE/bin/targets/airoha/an7581"
          # 与上一版比：从最近一个 ci-* tag 取基线（没有就只报告）
          BASE="$GITHUB_WORKSPACE/size-baseline.txt"
          PREV_TAG="$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            curl -fsSL --retry 2 -o "$BASE" \
              "https://github.com/${{ github.repository }}/releases/download/${PREV_TAG}/size-baseline.txt" || true
          fi
          "${GITHUB_WORKSPACE}/overlay/scripts/size-report.sh" . \
            ${BASE:+"$BASE"} --write-baseline "$GITHUB_WORKSPACE/size-baseline.txt" | tee "$GITHUB_WORKSPACE/size-report-$PROFILE.txt"
          # 把 release notes 提示词暴露给后续 job
          grep -o 'RELEASE_NOTE_HINT=.*' "$GITHUB_WORKSPACE/size-report-$PROFILE.txt" \
            | sed 's/^RELEASE_NOTE_HINT=//' > "$GITHUB_WORKSPACE/size-hint-$PROFILE.txt" || true

      - name: 上传 kmods + 自建包 feed（D5：自建 kmods/包供给链）
        # 为什么必须自建：官方 kmods 目录发布的是 6.18.44-1-<官方hash>，与本机构建 hash 不同；
        # 且 aarch64 vermagic 不含 config hash ⇒ apk 依赖解析**不会**发现不匹配（静默 ABI 风险）。
        # 设备 distfeeds 也没挂 kmods 这一项 ⇒ 运行期 apk add 官方 kmod 只会得到 "no such package"。
        # 因此能力只能随固件预装，而**增量** kmod/包由本 Release 附件供给（见 docs/adr/0006 §4、F92）。
        #
        # ⚠️ **if-no-files-found: error**（ci-118 教训）：原为 warn，而当时 kmods/ 根本不存在
        #   ⇒ 附件里 0 个 kmod、0 个索引，却**静默通过**。宁可红，不要假绿。
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kmodsfeed-${{ env.PROFILE }}
          if-no-files-found: error
          path: |
            ${{ env.TREE }}/bin/targets/airoha/an7581/kmods/**
            ${{ env.TREE }}/bin/packages/**/*.apk
            ${{ env.TREE }}/bin/packages/**/packages.adb
            ${{ env.TREE }}/bin/packages/**/APKINDEX*

      - name: 上传固件产物（sysupgrade + 首刷/initramfs）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PROFILE }}
          # F19：构建成功但无 itb 产物 = 静默失败（如目标未选中/打包异常），必须红
          if-no-files-found: error
          path: |
            ${{ env.TREE }}/bin/targets/airoha/an7581/*.itb
            ${{ env.TREE }}/bin/targets/airoha/an7581/*.manifest
            !${{ env.TREE }}/bin/targets/airoha/an7581/*-factory*
            # 体积自检结论与基线（release job 汇总进 release notes）
            size-report-*.txt
            size-hint-*.txt
            size-baseline.txt

  # P4（ROADMAP）：构建产出自动 pre-release。仅手动 dispatch 生成（push 触发只做门禁，
  # 不刷 release 噪音）；matrix 全档成功后才聚合发布，一个 run 一个 tag。
  release:
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # F24（2026-08-17）：checkout 必须在 download 之前——download-artifact 先跑的话，
      # 后续 checkout 的默认 clean:true 会把 _rel/（未跟踪）清掉，softprops 报
      # "Pattern '_rel/**' does not match any files"（ci-26 首次空壳，真产物手动补传）。
      # fetch-depth: 0（F25 2026-08-18）：默认 depth=1 无 tag，git describe 失败
      # → release 备注恒显示"（首次）"；全量取回让 prev tag 正常显示。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载全档固件产物
        uses: actions/download-artifact@v4
        with:
          path: _rel
          pattern: firmware-*
          # 不用 merge-multiple：同名 itb（openwrt-...-sysupgrade.itb 等）三档同名，
          # 合并会互相覆盖只剩一套——保留 firmware-<profile>/ 子目录结构，三档全保留

      - name: 下载 kmods / 自建包 feed（D5 供给链）
        # 与固件同一次构建产出 ⇒ 与内核 config hash 严格同源。设备侧把它挂进
        # /etc/apk/repositories.d/customfeeds.list 即可增量安装自建 kmod/包。
        uses: actions/download-artifact@v4
        with:
          path: _pkg
          pattern: kmodsfeed-*

      - name: 汇总体积自检结论（构建期已与上一版对比）
        id: size
        run: |
          set -uo pipefail
          hint=""
          for f in _rel/size-hint-*.txt; do
            [ -f "$f" ] || continue
            hint="$(cat "$f")"
          done
          base=""
          for f in _rel/size-baseline.txt; do
            [ -f "$f" ] && base="$f"
          done
          echo "hint<<EOF" >> "$GITHUB_OUTPUT"
          echo "${hint:-（无体积变化结论）}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          [ -n "$base" ] && cp "$base" _pkg/size-baseline.txt || true

      - name: 生成 release 备注（自上次 tag 的提交 + FIXES 台账头部）
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || echo '（首次）')
          {
            echo "### 刷机前必读（体积 / 布局）"
            echo "${{ steps.size.outputs.hint }}"
            echo
            echo "> 背景：\`fit\` 只读卷尺寸由 HTTP U-Boot 恢复页在上传镜像时**按镜像大小自动决定**（ADR-0004）。"
            echo "> 恢复页路径会移除 \`rootfs_data\` 卷 ⇒ **overlay 与全部配置被清空**，刷前务必 \`tar czf - /etc/config\` 备份。"
            echo "> 布局选择器**必须选 UBI 2.0**。详见 \`docs/FLASHING.md\` A3.4。"
            echo
            echo "### 自上次版本（$prev）以来的提交"
            git log --oneline -30 --no-merges
            echo
            echo "### 修复台账最近变更"
            sed -n '1,4p' docs/FIXES.md
            echo
            echo "### 刷机提醒"
            echo "请核对 docs/FLASHING.md（HTTP U-Boot 主路径，锁版 SHA256 以 YYH2913 release 页为准）。"
            echo
            echo "### 产物说明"
            echo "· \`firmware-<profile>.tar.gz\`：固件产物（sysupgrade + initramfs + chainload-uboot + manifest）"
            echo "· \`kmodsfeed-<profile>.tar.gz\`：**自建 kmods + 包 feed**，与本次固件同源（同一次构建、同一内核 config hash）"
            echo "  ↳ 设备侧挂载：\`echo '<解包目录的 file:// 或 https:// 地址>' >> /etc/apk/repositories.d/customfeeds.list\`"
            echo "  ↳ ⚠️ 官方 kmods 目录与本机构建 hash 不同，且 aarch64 vermagic 不含 hash ⇒ apk **不会**发现不匹配（静默 ABI 风险）——只能装本附件，勿混装官方 kmod（F92）"
            echo "· \`size-baseline.txt\`：体积基线，供下次构建对比"
            echo
            echo "本次档位：${{ github.event.inputs.profile }}"
          } > relnotes.md
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: 打包各档产物（同名 itb 会被 softprops 按 basename 去重覆盖——先打包避免资产冲突）
        run: |
          cd _rel
          for d in firmware-*/; do
            [ -d "$d" ] || continue
            profile="${d%/}"
            tar -czf "${profile}.tar.gz" "$d"
          done
          cd ../_pkg
          for d in kmodsfeed-*/; do
            [ -d "$d" ] || continue
            profile="${d%/}"
            tar -czf "${profile}.tar.gz" "$d"
          done
          # 体积基线与 kmods 包放到 release 根，便于直接下载
          [ -f size-baseline.txt ] && cp size-baseline.txt ../_rel/ || true

      - name: 创建 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: "CI 构建 #${{ github.run_number }}（${{ github.ref_name }} @ ${{ steps.notes.outputs.prev }} 起）"
          body_path: relnotes.md
          files: |
            _rel/*.tar.gz
            _pkg/*.tar.gz
            _rel/size-baseline.txt
          prerelease: true