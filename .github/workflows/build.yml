name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '构建档位（stock / oc-1.3 / oc-1.4 / all）'
        default: 'all'
        required: true
  schedule:
    # 每周一 04:00 UTC 自动同步上游 master 并构建（决策：手动 + 每周自动同步）
    - cron: '0 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          P='${{ github.event.inputs.profile || (github.event_name == 'schedule' && 'all') || 'stock' }}'
          if [ "$P" = "all" ]; then echo "matrix={\"profile\":[\"stock\",\"oc-1.3\",\"oc-1.4\"]}" >> "$GITHUB_OUTPUT"
          else echo "matrix={\"profile\":[\"$P\"]}" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
      fail-fast: false
    env:
      PROFILE: ${{ matrix.profile }}
      TREE: ${{ github.workspace }}/openwrt
    steps:
      - uses: actions/checkout@v4

      - name: 同步上游 openwrt master（fork 自身的 openwrt 主树）
        run: |
          cd "$TREE"
          git config user.name "ci"
          git config user.email "ci@localhost"
          git remote add upstream https://github.com/openwrt/openwrt.git || true
          git fetch upstream main
          git merge upstream/main --no-edit || { echo "上游同步冲突——修复而不是降级：处理冲突后重跑"; exit 1; }

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            time

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: openwrt-${{ env.PROFILE }}

      - name: 应用补丁层
        run: |
          chmod +x scripts/*.sh
          ./scripts/apply-patches.sh "$TREE"

      - name: OC 档位
        run: |
          if [[ "$PROFILE" != stock ]]; then ./scripts/prepare-oc.sh "${PROFILE#oc-}" "$TREE"; fi

      - name: feeds
        run: |
          cd "$TREE"
          cp -f feeds.conf.default feeds.conf
          cat "$GITHUB_WORKSPACE/config/feeds.custom.conf" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置（defconfig + seed）
        run: |
          cd "$TREE"
          make defconfig
          cat "$GITHUB_WORKSPACE/config/seed-config.diff" >> .config
          make defconfig
          grep -q "CONFIG_TARGET_airoha_an7581_gemtek_xr1710g-ubi=y" .config || { echo "XR1710G 目标未选中"; exit 1; }

      - name: 构建
        run: |
          cd "$TREE"
          make -j"$(nproc)" V=s 2>&1 | tee "$GITHUB_WORKSPACE/build-$PROFILE.log"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ env.PROFILE }}
          path: build-${{ env.PROFILE }}.log

      - name: 上传固件产物（sysupgrade + 首刷/initramfs）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PROFILE }}
          path: |
            ${{ env.TREE }}/bin/targets/airoha/an7581/*.itb
            ${{ env.TREE }}/bin/targets/airoha/an7581/*.manifest
            !${{ env.TREE }}/bin/targets/airoha/an7581/*-factory*