name: Create GitHub release

permissions:
  contents: write

# One release per repository at a time.  Both tiers write outside this repo and
# share the workspace tiers of the builder named by XR1710G_BUILD_RUNNER, so a
# cancelled run would leave a half-packed distfeeds/ and a half-published
# release behind: never cancel, queue instead.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
      - "distfeeds-*"
  workflow_dispatch:

env:
  # Every product this workflow talks about is built in genshanxinli/xr1710g-builds:
  # this repo is a source tree, so `bin/` only exists on a builder that ran
  # make.  Both repos are public, and an asset of a release there can be read
  # anonymously -- hence the fetch below is a release asset and not an artifact
  # from the build repo.  `actions/download-artifact` across repositories needs
  # `actions:read` on the *other* repo, i.e. a fine-grained PAT or a deploy key
  # kept as a long-lived secret, and an artifact expires (90 days by default)
  # while a release asset stays readable for the tag that names it.
  BUILDS_REPO: genshanxinli/xr1710g-builds

jobs:
  # Tier 1: a workspace that already holds the finished build.  Only a
  # self-hosted builder has bin/ and the image bytes, so this tier is gated on
  # the runner variable instead of running green-by-accident on a hosted runner
  # (#6): the job that used to sit on ubuntu-latest could never find bin/, so
  # the first tag pushed would have gone red on a step that never had a chance.
  #
  # The pack step never skips.  build-distfeeds.sh already refuses an empty
  # bin/, and `test -s` plus fail_on_unmatched_files make a missing feed turn
  # the job red; the old `else echo skipping` branch let the release publish
  # without its feeds and say nothing.
  release:
    if: vars.XR1710G_BUILD_RUNNER != ''
    runs-on: ${{ vars.XR1710G_BUILD_RUNNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # This job exists to pack the bin/ that the previous `make` left in
          # this workspace.  The default clean runs `git clean -ffdx`, which
          # deletes bin/ (and distfeeds/, and the signing key) before the pack
          # step that is supposed to read them.
          clean: false

      - name: Pack distfeeds
        run: |
          if [ ! -d bin/packages ] && [ ! -d bin/targets ]; then
            echo "::error::$PWD carries no bin/ from a finished build; tier 1 needs the builder named by the repository variable XR1710G_BUILD_RUNNER (is the checkout missing clean: false?)"
            exit 1
          fi
          ./scripts/build-distfeeds.sh distfeeds
          tar -czf distfeeds.tar.gz -C distfeeds .
          test -s distfeeds.tar.gz
          ls -l distfeeds.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            distfeeds.tar.gz
            bin/targets/**/*.itb
            bin/targets/**/*.manifest
            bin/targets/**/sha256sums
            bin/targets/**/profiles.json

  # Tier 2: no bin/ at all (ubuntu-latest).  The release of the build repo
  # carries the feed tree that build produced, next to the image.  Fetch it for
  # the commit this tag names, put it where build-distfeeds.sh looks for a build
  # tree, and re-derive the published tree from it so the script's own checks
  # (index against the .apk files on disk) run against the *published* bytes.
  # A tag with no matching build, a release whose feeds went missing, or a feed
  # tree that no longer agrees with its index is red here, not on a device.
  #
  # Then publish the tarball this tier just verified.  It used to end at `ls -l`
  # and let the file die with the runner: the tag push went green, the workflow
  # named "Create GitHub release" created no release, and the verified feeds
  # were thrown away (#P0-2).  The `files:` list is deliberately only the
  # tarball -- tier 2 has no bin/targets, and `fail_on_unmatched_files: true`
  # would turn the first such glob into a red tag.
  feed-source:
    if: vars.XR1710G_BUILD_RUNNER == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads a public API and a public release asset, so it needs no token and
      # no secret exists to leak or rotate.  One unauthenticated API call per
      # run stays well inside the 60/hour that IP gets.
      - name: Fetch the build's distfeeds for this commit
        run: |
          set -eu
          fail() { printf '::error::%s\n' "$*"; exit 1; }

          sha=$(git rev-parse --short HEAD)
          echo "looking for distfeeds-$sha.tar.gz in $BUILDS_REPO's releases"
          curl -fsSL --retry 3 \
            "https://api.github.com/repos/$BUILDS_REPO/releases?per_page=100" \
            -o "$RUNNER_TEMP/releases.json" ||
            fail "cannot list the releases of $BUILDS_REPO: the build that produced $sha never published its feeds"

          rc=0
          python3 - "$sha" >"$RUNNER_TEMP/asset-url" <<'PY' || rc=$?
          import json, os, sys

          want = "distfeeds-%s.tar.gz" % sys.argv[1]
          path = os.path.join(os.environ["RUNNER_TEMP"], "releases.json")
          for rel in json.load(open(path)):
              for asset in rel.get("assets") or ():
                  if asset.get("name") == want:
                      print(asset["browser_download_url"])
                      sys.exit(0)
          sys.exit("no asset named %s" % want)
          PY
          [ "$rc" -eq 0 ] ||
            fail "$BUILDS_REPO has no release asset distfeeds-$sha.tar.gz: run its build workflow for this commit first"

          url=$(cat "$RUNNER_TEMP/asset-url")
          echo "asset: $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/distfeeds.tar.gz" "$url" ||
            fail "cannot download $url"
          test -s "$RUNNER_TEMP/distfeeds.tar.gz" ||
            fail "$url downloaded empty"
          sha256sum "$RUNNER_TEMP/distfeeds.tar.gz"

          mkdir -p "$RUNNER_TEMP/build/bin"
          tar -xzf "$RUNNER_TEMP/distfeeds.tar.gz" \
            -C "$RUNNER_TEMP/build/bin" --strip-components=1 ||
            fail "cannot unpack $RUNNER_TEMP/distfeeds.tar.gz"
          test -f "$RUNNER_TEMP/build/bin/targets/airoha/an7581/packages/packages.adb" ||
            fail "the fetched feed tree has no targets/airoha/an7581/packages/packages.adb"

          # The asset is packed from bin/, so --strip-components=1 puts its
          # public-key.pem at build/bin/public-key.pem, while build-distfeeds.sh
          # only looks at $TOPDIR/public-key.pem.  It looked, found nothing and
          # said nothing, so the re-derived tree shipped one file short (#362).
          # Move the key to the path the script reads, and make its absence red:
          # a feed without the key cannot be verified by any device.
          cp "$RUNNER_TEMP/build/bin/public-key.pem" "$RUNNER_TEMP/build/public-key.pem" \
            || { echo "::error::the distfeeds asset carries no public-key.pem"; exit 1; }

      - name: Re-derive the published tree from the build output
        run: |
          TOPDIR="$RUNNER_TEMP/build" ./scripts/build-distfeeds.sh distfeeds
          tar -czf distfeeds.tar.gz -C distfeeds .
          test -s distfeeds.tar.gz
          ls -l distfeeds.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            distfeeds.tar.gz
