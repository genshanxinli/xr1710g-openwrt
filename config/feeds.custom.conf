# feeds.custom.conf — 本仓库自定义 feed（build.sh / CI 追加到官方 feeds.conf.default 之后）
# 决策：外部包一律 src-git / src-git-full + 锁定 commit（可复现；升级时显式 bump 并记 FIXES.md）

# ── 本仓库内置包（src-link，相对树根；CI/build.sh 已把整个 overlay 叠加进树）──
# 注意 1：scripts/feeds 用 `ln -s <path> feeds/<name>` 创建原文链接——相对路径从 feeds/ 目录解析！
#        所以指向 TOPDIR 下目录必须写 `../<path>`（默认 base feed 也是 ../package，见 include/toplevel.mk）。
# 注意 2：src-link 的 path 须直接包含各包目录（<feedroot>/<pkg>/Makefile），本仓库包在
#        packages-xr1710g/package/ 下（<feedroot>=packages-xr1710g/package）。（F17 双坑：漏 ../ 或指错层级都=零索引静默丢包）
src-link xr1710g ../packages-xr1710g/package

# ── 应用供给（2026-08-17 起）──
# 决策五件套：
#   luci-app-{airoha-npu,airoha-flowsense,mlo,w1700k-fancontrol} = patches/vendor/fanboy/19-w1700k-apps-pack
#     （MANIFEST 默认档 ROOT 随树内置；拆包评审 F13 后可选独立 feed）；
#   luci-app-filemanager = 官方 luci feed（applications/，无需自定义）；
#   luci-app-airoha-recovery = 本仓库 vendor（packages-xr1710g/，src-link 供给；
#     源 naoki66/ImmortalWrt-for-Gemtek-XR1710G@dd9ecfeef，登记见 packages-xr1710g/README.md）。
# 为避免包冲突，以下独立 feed 全部作为「备选/升级通道」注释保留（FIXES F13 拆包评审后二选一）：
# src-git-full mlo        https://github.com/YYH2913/luci-app-mlo.git^911912b168f249a4787740ae46c73169482e7af2
# src-git-full fancontrol https://github.com/rchen14b/luci-app-w1700k-fancontrol.git^2c6cc7a314a6cb516bc0bafd1d5446e84c628432

# ── DNS 中枢（2026-09-08 决策：mosdns 主推线，见 DNS方案深度调研-2026-09-08.md §五 Phase 0）──
# 锁 v5.3.4-r13（release 2026-09-05，对应 commit df6d67b，git ls-remote 已核实）；
# 升级时显式 bump 并记 FIXES；PKG_MIRROR_HASH 实算（禁 hash=skip）。
# 单 feed 供给：mosdns（Go DNS 中枢）+ luci-app-mosdns（LuCI + geosite/geoip 名单数据依赖）
src-git-full mosdns https://github.com/sbwml/luci-app-mosdns.git^df6d67b84d32246081e259f3cb93dae63962a1fc

# ── 科学上网（2026-09-08 深度调研定稿：主选 OpenWrt-nikki/mihomo，F90）──
# nikki 三包（nikki/luci-app-nikki/mihomo-meta）：mihomo 内核构建期源码编译 + 全 opkg 管理，
#   无运行时核心下载（锁源铁律契合；mosdns fake-ip 接口已为其预置，见 DNS 决策）；依赖无 bash/ruby。
# 锁 main 3799926b（2026-08-17 实测；调研文档所记 09-08 提交实为 dependabot 分支，以 ls-remote 为准）；
# mihomo-meta 自带 PKG_SOURCE_URL=MetaCubeX/mihomo.git + pin v1.19.30 + PKG_MIRROR_HASH（实质满足锁源，
#   tarball 化留评审候选）；bump 走 PR 评审 + docs/FIXES.md F90 登记（与 P2 工作流同构）。
src-git-full nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git^3799926b147d7065ac98508f16951f8714e53659

