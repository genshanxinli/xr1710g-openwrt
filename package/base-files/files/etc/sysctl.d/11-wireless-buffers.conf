# Do not edit, changes to this file will be lost on upgrades
# /etc/sysctl.conf can be used to customize sysctl settings
#
# Wireless receive-path buffers (issue #5, ported from the
# airoha-an7581-mt7996-board reference tree).
#
# Applied by /etc/init.d/sysctl (START=11) from /etc/sysctl.d/*.conf, before
# network (START=20) and before packet_steering (START=25) start handing RX
# queues to remote CPUs.  No key here collides with 10-default.conf,
# sysctl-br-netfilter.conf, sysctl-nf-conntrack.conf or the traffic-chart
# file: those carry no net.core.* entries at all.

# These two restate what this tree already runs, deliberately unchanged:
# sysctl_rmem_max defaults to 4 MB in the kernel (net/core/sock.c:289) and
# SK_RMEM_DEFAULT is 1 MB through
# target/linux/generic/hack-6.18/672-net-core-raise-rmem-default.patch.  They
# are pinned here so the wireless path cannot silently shrink back to the
# upstream 212992 / ~256 kB defaults if either is reverted.  The 1 MB default
# matters because RX on this SoC goes through HW-GRO/LRO, which charges
# several KB of skb truesize per small frame, and no application can raise
# SO_RCVBUF past rmem_max.
net.core.rmem_default=1048576
net.core.rmem_max=4194304

# 1000 is the kernel default and what the board was measured at.  With
# packet_steering=2 every RX queue is pinned to all CPUs
# (53_packet-steering), so frames enter the per-CPU backlog instead of
# running inline in the RX softirq; at backlog 1000 the board counted 63006
# softnet drops during a 200k-packet flow, and widening the mask is what
# removed them.
#
# 2000 is a doubling and nothing more.  The worst case is one skb per slot:
# SKB_TRUESIZE of a 1500-byte frame is ~2.3 kB, so 2000 slots are ~4.6 MB
# per CPU and that memory is only charged while a queue is actually full --
# a per-CPU queue that never fills costs the pointer array and nothing else.
# It is not raised further because the charged memory and the queueing delay
# both grow with the value, on every device in the tree, and a device that
# inherits 2000 can still be flooded by a 10 Gbps line.
net.core.netdev_max_backlog=2000
